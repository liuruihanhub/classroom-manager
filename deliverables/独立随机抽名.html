<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1e8069"><title>独立随机抽名</title><style>:root {
  font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  color: var(--text);
  background: var(--page);
  --page: #eef5f1;
  --surface: #ffffff;
  --surface-muted: #f7faf8;
  --surface-accent: #e1f1ea;
  --text: #283a34;
  --muted: #61766e;
  --border: #d5e3dc;
  --primary: #1e8069;
  --primary-hover: #176652;
  --danger: #a53f3f;
  --focus: #0d725e;
  --sidebar: #173d34;
  --radius-sm: 8px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --shadow-sm: 0 4px 14px rgba(31, 73, 61, .07);
  --motion: 180ms;
}
* { box-sizing: border-box; }
body { margin: 0; min-width: 320px; min-height: 100vh; overflow-x: hidden; background: var(--page); }
button, input, select, textarea { font: inherit; }
button, .file { min-height: 42px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); padding: .65rem .85rem; cursor: pointer; color: var(--text); transition: border-color var(--motion) ease, background-color var(--motion) ease, color var(--motion) ease; }
button:hover, .file:hover { border-color: var(--primary); color: var(--primary-hover); background: var(--surface-muted); }
button:focus-visible, .file:focus-within, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid color-mix(in srgb, var(--focus) 38%, transparent); outline-offset: 2px; }
button:disabled { opacity: .48; cursor: not-allowed; }
button.primary { background: var(--primary); color: var(--surface); border-color: var(--primary); font-weight: 800; }
button.primary:hover { background: var(--primary-hover); color: var(--surface); border-color: var(--primary-hover); }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 100vh; }
.main { min-width: 0; padding: clamp(1rem, 3vw, 2rem); display: grid; grid-template-rows: auto 1fr auto; gap: 1rem; }
.top { display: flex; justify-content: space-between; gap: 1rem; align-items: center; }
.brand h1 { margin: .2rem 0; font-size: clamp(1.4rem, 3vw, 2rem); line-height: 1.25; }
.brand p { margin: 0; color: var(--muted); font-size: .85rem; }
.controls { display: flex; gap: .5rem; flex-wrap: wrap; }
.controls select { min-width: 180px; border: 1px solid var(--border); border-radius: var(--radius-md); padding: .65rem; background: var(--surface); color: var(--text); }
.stage { min-height: 430px; display: grid; place-items: center; align-content: center; text-align: center; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface-accent); box-shadow: var(--shadow-sm); }
.stage small { color: var(--muted); }
.stage strong { font-size: clamp(4.5rem, 12vw, 10rem); line-height: 1.08; color: var(--primary); letter-spacing: .04em; }
.stage span { font-size: clamp(1.1rem, 2vw, 1.6rem); color: var(--muted); margin: .7rem 0 1.7rem; }
.stage button { font-size: 1.25rem; min-width: 230px; min-height: 60px; }
.bottom { display: flex; align-items: center; justify-content: space-between; gap: 1rem; color: var(--muted); }
.switch { display: flex; gap: .45rem; align-items: center; color: var(--text); }
.switch input { width: 18px; height: 18px; }
.side { min-width: 0; background: var(--surface); border-left: 1px solid var(--border); padding: 1rem; display: flex; flex-direction: column; gap: .85rem; overflow: auto; }
.panel { border-bottom: 1px solid var(--border); padding: .3rem 0 1rem; }
.panel:last-child { border-bottom: 0; }
.panel h2 { margin: 0 0 .8rem; font-size: 1rem; }
.row { display: flex; gap: .5rem; flex-wrap: wrap; }
.row > * { flex: 1; }
.file { display: inline-flex; justify-content: center; align-items: center; }
.file input { display: none; }
textarea { width: 100%; border: 1px solid var(--border); border-radius: var(--radius-md); padding: .65rem; resize: vertical; margin: .6rem 0; background: var(--surface); color: var(--text); }
.student-list { display: grid; gap: .35rem; max-height: 300px; overflow: auto; }
.student-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: .55rem; padding: .5rem; background: var(--surface-muted); border-radius: var(--radius-sm); }
.student-row input { width: 17px; height: 17px; }
.student-row span { display: grid; min-width: 0; }
.student-row small { color: var(--muted); }
.student-row b { font-size: .78rem; color: var(--primary); }
.student-row button { min-height: 34px; padding: .15rem .45rem; border: 0; background: transparent; color: var(--danger); font-size: 1.2rem; }
.history { list-style: none; padding: 0; margin: 0; display: grid; gap: .4rem; max-height: 220px; overflow: auto; }
.history li { display: flex; justify-content: space-between; gap: 1rem; padding: .55rem; border-bottom: 1px solid var(--border); }
.history span { display: grid; }
.history small, .history time { color: var(--muted); }
.history time { font-size: .8rem; }
.empty { padding: 1.2rem; text-align: center; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: 1.2rem; transform: translate(-50%, 8px); opacity: 0; max-width: calc(100vw - 2rem); padding: .8rem 1rem; border-radius: var(--radius-md); background: var(--sidebar); color: var(--surface); box-shadow: var(--shadow-sm); transition: opacity var(--motion) ease, transform var(--motion) ease; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
body.projecting .side { display: none; }
body.projecting .app { display: block; }
body.projecting .main { min-height: 100vh; }
body.projecting .stage { min-height: calc(100vh - 190px); }
body.projecting .stage strong { font-size: clamp(7rem, 18vw, 15rem); }
@media (max-width: 850px) {
  .app { grid-template-columns: 1fr; }
  .side { border-left: 0; border-top: 1px solid var(--border); }
  .stage { min-height: 390px; }
  .top, .bottom { align-items: stretch; flex-direction: column; }
  .controls > * { flex: 1; }
  .stage strong { font-size: clamp(4rem, 20vw, 7rem); }
  button, .file, select, textarea { min-height: 48px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
}
</style></head><body><div class="app"><main class="main"><header class="top"><div class="brand"><p>独立单页 · 数据只在本机</p><h1>课堂随机抽名</h1></div><div class="controls"><select id="class-select" aria-label="班级"></select><select id="mode" aria-label="抽名模式"><option value="pure">纯随机</option><option value="weighted">加权随机</option></select><button id="project">进入大字投屏</button></div></header><section class="stage"><small>可参与 <b id="eligible-count">0</b> 人</small><strong id="winner-name">准备抽名</strong><span id="winner-no">—</span><button id="draw" class="primary">开始抽名</button></section><footer class="bottom"><label class="switch"><input id="sound" type="checkbox">滚动与定格音效</label><span>默认纯随机；加权模式会降低已抽中学生的权重</span></footer></main><aside class="side"><section class="panel"><h2>班级管理</h2><div class="row"><button id="add-class">新建班级</button><button id="delete-class">删除班级</button></div></section><section class="panel"><h2>导入名单</h2><div class="row"><label class="file">选择 Excel / CSV / JSON<input id="import-file" type="file" accept=".xlsx,.xls,.csv,.json"></label><button id="manual-add">手动添加学生</button></div><textarea id="paste" rows="4" aria-label="粘贴学生名单" placeholder="粘贴姓名；学号可选"></textarea><button id="paste-add">校验并添加名单</button></section><section class="panel"><h2>本次名单（勾选排除）</h2><div id="student-list" class="student-list"></div></section><section class="panel"><div class="row"><h2>抽名历史</h2><button id="clear-history">清空抽名记录</button></div><ul id="history" class="history"></ul></section></aside></div><div id="toast" class="toast" role="status" aria-live="polite"></div><script>(()=>{var fi={};fi.version="0.20.3";var gr=1200,Vt=1252,Se,nf=[874,932,936,949,950,1250,1251,1252,1253,1254,1255,1256,1257,1258,1e4],Cn={0:1252,1:65001,2:65001,77:1e4,128:932,129:949,130:1361,134:936,136:950,161:1253,162:1254,163:1258,177:1255,178:1256,186:1257,204:1251,222:874,238:1250,255:1252,69:6969},bn=function(e){nf.indexOf(e)!=-1&&(Vt=Cn[0]=e)};function sf(){bn(1252)}var Kr=function(e){gr=e,bn(e)};function ci(){Kr(1200
