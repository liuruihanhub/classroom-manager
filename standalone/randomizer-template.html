<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1e8069"><title>独立随机抽名</title><style>/*__CSS__*/</style></head><body><div class="app"><main class="main"><header class="top"><div class="brand"><p>独立单页 · 数据只在本机</p><h1>课堂随机抽名</h1></div><div class="controls"><select id="class-select" aria-label="班级"></select><select id="mode" aria-label="抽名模式"><option value="pure">纯随机</option><option value="weighted">加权随机</option></select><button id="project">进入大字投屏</button></div></header><section class="stage"><small>可参与 <b id="eligible-count">0</b> 人</small><strong id="winner-name">准备抽名</strong><span id="winner-no">—</span><button id="draw" class="primary">开始抽名</button></section><footer class="bottom"><label class="switch"><input id="sound" type="checkbox">滚动与定格音效</label><span>默认纯随机；加权模式会降低已抽中学生的权重</span></footer></main><aside class="side"><section class="panel"><h2>班级管理</h2><div class="row"><button id="add-class">新建班级</button><button id="delete-class">删除班级</button></div></section><section class="panel"><h2>导入名单</h2><div class="row"><label class="file">选择 Excel / CSV / JSON<input id="import-file" type="file" accept=".xlsx,.xls,.csv,.json"></label><button id="manual-add">手动添加学生</button></div><textarea id="paste" rows="4" aria-label="粘贴学生名单" placeholder="粘贴姓名；学号可选"></textarea><button id="paste-add">校验并添加名单</button></section><section class="panel"><h2>本次名单（勾选排除）</h2><div id="student-list" class="student-list"></div></section><section class="panel"><div class="row"><h2>抽名历史</h2><button id="clear-history">清空抽名记录</button></div><ul id="history" class="history"></ul></section></aside></div><div id="toast" class="toast" role="status" aria-live="polite"></div><script>/*__JS__*/</script></body></html>
